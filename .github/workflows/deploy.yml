name: CI Verification & GitHub Pages Deploy
on:
push:
branches: ["main", "master"]
pull_request:
branches: ["main", "master"]
workflow_dispatch:
permissions:
contents: read
pages: write
id-token: write
concurrency:
group: "pages"
cancel-in-progress: false
jobs:
verify-and-build:
runs-on: ubuntu-24.04
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Setup Node.js 22
uses: actions/setup-node@v4
with:
node-version: "22"
- name: Ensure .gitignore exists & Install dependencies (No Lockfile Required)
run: |
[ -f .gitignore ] || printf "node_modules/\ndist/\n*.lvvault\n.DS_Store\n" > .gitignore
npm install --no-package-lock
- name: Run 4-Layer PII, Crypto, Audio & CLI Verification Suite
run: npm test
- name: Build production Vite bundle
run: npm run build
- name: Configure GitHub Pages
if: github.event_name == 'push'
uses: actions/configure-pages@v5
with:
enablement: true
- name: Upload Pages Artifact
if: github.event_name == 'push'
uses: actions/upload-pages-artifact@v3
with:
path: "./dist"
deploy:
if: github.event_name == 'push'
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-24.04
needs: verify-and-build
steps:
- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
